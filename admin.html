<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>لوحة التحكم | WALEEDMMH</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/style.css">
<style>
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}.tabs button,.sm{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sm{padding:3px 10px;font-size:14px}.sm.dn{color:var(--bd);border-color:var(--bd)}
.fld{margin-bottom:6px}.fld small{color:var(--mu)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.two{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--ln);margin:10px 0}.bars i{flex:1;background:var(--ac);min-height:2px;border-radius:2px 2px 0 0}.bars i.d{background:var(--ok)}
.msg{position:sticky;bottom:8px;z-index:9}.msg .warn,.msg .okm{background:var(--sf)}.okm{color:var(--ok);border:1px solid var(--ok);border-radius:8px;padding:8px 12px}
.thumb{height:64px;border-radius:8px;border:1px solid var(--ln);margin:4px 4px 0 0}.x{color:var(--bd);cursor:pointer;border:0;background:none;font:inherit}
.lnk{direction:ltr;text-align:left}
</style></head>
<body><header class="top"><a class="brand" href="/admin/"><span>لوحة التحكم</span></a><nav><a href="/" target="_blank" rel="noopener">عرض الموقع</a></nav><button id="out" class="ic" type="button" aria-label="تسجيل الخروج" hidden>⎋</button></header>
<main id="app"></main><div id="msg" class="msg"></div>
<script src="/admin/admin.js"></script></body></html>
